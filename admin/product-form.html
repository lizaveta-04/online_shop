<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить товар — Админ-панель</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="page-wrapper">
        <header>
            <nav class="nav">
                <div class="container">
                    <div class="logo">
                        🐾 Админ-панель
                    </div>
                    <div class="menu">
                        <a href="../index.html" target="_blank">Магазин</a>
                        <a href="dashboard.html">Дашборд</a>
                        <a href="login.html">Выйти</a>
                    </div>
                </div>
            </nav>
        </header>

        <div class="admin-layout">
            <aside class="sidebar">
                <div class="sidebar-title">🐾 Админ-панель</div>
                <div class="sidebar-section-title">Основное</div>
                <ul class="sidebar-nav">
                    <li><a href="dashboard.html" class="sidebar-link"><span class="sidebar-link-icon">📊</span> Дашборд</a></li>
                </ul>
                <div class="sidebar-section-title">Каталог</div>
                <ul class="sidebar-nav">
                    <li><a href="products.html" class="sidebar-link active"><span class="sidebar-link-icon">📦</span> Товары</a></li>
                    <li><a href="categories.html" class="sidebar-link"><span class="sidebar-link-icon">📁</span> Категории</a></li>
                </ul>
                <div class="sidebar-section-title">Продажи</div>
                <ul class="sidebar-nav">
                    <li><a href="orders.html" class="sidebar-link"><span class="sidebar-link-icon">🛒</span> Заказы</a></li>
                </ul>
                <div class="sidebar-section-title">Обратная связь</div>
                <ul class="sidebar-nav">
                    <li><a href="applications.html" class="sidebar-link"><span class="sidebar-link-icon">📝</span> Заявки</a></li>
                </ul>
            </aside>

            <div class="admin-content">
                <ol class="breadcrumb">
                    <li><a href="dashboard.html">Дашборд</a></li>
                    <li><a href="products.html">Товары</a></li>
                    <li>Добавить товар</li>
                </ol>

                <div class="admin-header">
                    <h1>Добавление товара</h1>
                </div>

                <div class="card" style="max-width: 650px;">
                    <div class="card-body">
                        <form action="/admin/products" method="POST" enctype="multipart/form-data">
                            <div class="form-group">
                                <label for="name">Название товара:</label>
                                <input type="text" id="name" name="name" required placeholder="Например: Корм для собак">
                            </div>

                            <div class="form-group">
                                <label for="description">Описание:</label>
                                <textarea id="description" name="description" rows="4" placeholder="Подробное описание товара..."></textarea>
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                                <div class="form-group">
                                    <label for="price">Цена (₽):</label>
                                    <input type="number" id="price" name="price" required min="0" step="0.01" placeholder="450.00">
                                </div>
                                <div class="form-group">
                                    <label for="stock">Остаток на складе:</label>
                                    <input type="number" id="stock" name="stock" required min="0" placeholder="100">
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="category_id">Категория:</label>
                                <select id="category_id" name="category_id" class="form-select" required>
                                    <option value="">Выберите категорию</option>
                                    <option>Корма</option>
                                    <option>Игрушки</option>
                                    <option>Аксессуары</option>
                                    <option>Для грызунов</option>
                                    <option>Лежанки</option>
                                    <option>Гигиена</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="image">Изображение:</label>
                                <input type="file" id="image" name="image" accept="image/*">
                                <small style="color: #7a6a58; font-size: 12px;">PNG, JPG до 2 МБ</small>
                            </div>

                            <div class="form-group">
                                <label>
                                    <input type="checkbox" name="is_active" checked> Опубликовать товар
                                </label>
                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 10px;">
                                <button type="submit" class="btn btn-primary">Создать товар</button>
                                <a href="products.html" class="btn btn-outline">Отмена</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
